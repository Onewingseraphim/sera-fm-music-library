name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:win
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "release/SERA.FM Music Library-win32-x64" -DestinationPath "SERA-FM-Music-Library-Windows.zip"
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "SERA-FM-Music-Library-Windows.zip" --title "SERA.FM Music Library ${{ github.ref_name }}" --generate-notes
      - name: Upload manual-build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SERA-FM-Music-Library-Windows
          path: SERA-FM-Music-Library-Windows.zip
